<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cable Guy AI | Store</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="top-nav">
      <a class="brand" href="/index.html">Cable Guy AI</a>
      <nav>
        <a href="/index.html">Home</a>
        <a href="/store.html" class="active">Store</a>
        <a href="/cart.html">Cart</a>
        <a href="/dashboard.html">My Dashboard</a>
      </nav>
    </header>

    <main class="store-sections">
      <section class="store-heading card">
        <h1>Store</h1>
        <p class="subtext">Browse products, kits, and services. Add what you want to your cart and checkout in one flow.</p>
      </section>

      <section>
        <div class="section-header-row">
          <h2>Networking Kits</h2>
          <a class="button secondary" href="/cart.html">View Cart</a>
        </div>
        <div id="kit-grid" class="feature-grid"></div>
      </section>

      <section>
        <h2>Products</h2>
        <div id="product-grid" class="product-grid"></div>
      </section>

      <section>
        <h2>Services</h2>
        <div id="service-grid" class="product-grid"></div>
      </section>
    </main>

    <div id="detailsModal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="details-modal-title">
      <div class="modal-card details-modal-card">
        <button id="close-details-modal" class="modal-close" type="button" aria-label="Close details popup">×</button>
        <h3 id="details-modal-title">Details</h3>
        <div id="details-modal-body"></div>
        <div class="kit-card-actions">
          <button id="cancel-details-modal" class="button secondary" type="button">Close</button>
        </div>
      </div>
    </div>

    <script src="/auth.js"></script>
    <script src="/store.js"></script>
  </body>
</html>
