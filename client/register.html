<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cable Guy</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="top-nav">
      <a class="brand" href="/index.html">Cable Guy</a>
      <nav>
        <a href="/register.html" class="active">Create Account</a>
        <a href="/login.html">Login</a>
      </nav>
    </header>

    <main class="narrow">
      <section class="card">
        <h1>Create Account</h1>
        <form id="register-form" class="stack-form">
          <input id="name" type="text" placeholder="Full name" required />
          <input id="contact_number" type="text" placeholder="Contact number" required />
          <input id="email" type="email" placeholder="Email" required />
          <input id="address" type="text" placeholder="Delivery address" required />
          <input id="password" type="password" placeholder="Password (min 8 chars)" required minlength="8" />
          <button class="button primary" type="submit">Sign Up</button>
        </form>
        <p id="result" class="subtext"></p>
      </section>
    </main>

    <script src="/auth.js"></script>
    <script src="/register.js"></script>
  </body>
</html>
