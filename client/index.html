<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cable Guy AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-100 min-h-screen">
    <main class="max-w-3xl mx-auto px-4 py-8">
      <section class="bg-white rounded-2xl shadow-lg border border-slate-200 overflow-hidden">
        <header class="bg-slate-800 text-white px-6 py-4">
          <h1 class="text-xl font-bold">Cable Guy AI</h1>
          <p class="text-sm text-slate-200">Diagnose WiFi issues and get the right network kit.</p>
        </header>

        <div id="chat" class="h-[65vh] overflow-y-auto p-4 space-y-3 bg-slate-50"></div>

        <form id="chat-form" class="p-4 border-t border-slate-200 bg-white flex gap-2">
          <input
            id="message-input"
            type="text"
            placeholder="Describe your network problem..."
            class="flex-1 rounded-xl border border-slate-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-slate-700"
            required
          />
          <button
            id="send-button"
            type="submit"
            class="rounded-xl bg-slate-800 text-white px-5 py-3 font-medium hover:bg-slate-900 disabled:opacity-50"
          >
            Send
          </button>
        </form>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
